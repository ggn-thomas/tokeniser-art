[package]
name = "tokenizeart"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = "1.6.1"
solana-program = "2.3"
spl-token = {version = "8.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
mpl-token-metadata = "5.1.1"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
default = []